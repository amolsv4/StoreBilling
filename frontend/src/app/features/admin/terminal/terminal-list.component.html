<app-page-header title="Terminals" subtitle="POS/MPOS/KIOSK devices registered to a store.">
  <button mat-flat-button color="primary" *ngIf="authService.hasPermission('TERMINAL_CREATE')" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Terminal
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [data]="terminals()"
  [totalElements]="totalElements()"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [loading]="loading()"
  [editDisabled]="!authService.hasPermission('TERMINAL_UPDATE')"
  [toggleDisabled]="!authService.hasPermission('TERMINAL_UPDATE')"
  emptyMessage="No terminals found."
  (page)="onPage($event)"
  (edit)="openEdit($event)"
  (toggleActive)="onToggleActive($event)"
></app-data-table>
