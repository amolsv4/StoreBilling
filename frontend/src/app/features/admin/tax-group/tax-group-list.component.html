<app-page-header title="Tax Groups" subtitle="Bundles of tax components applied together to a product.">
  <button mat-flat-button color="primary" *ngIf="authService.hasPermission('TAX_CREATE')" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Tax Group
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [data]="taxGroups()"
  [totalElements]="totalElements()"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [loading]="loading()"
  [editDisabled]="!authService.hasPermission('TAX_UPDATE')"
  [toggleDisabled]="!authService.hasPermission('TAX_UPDATE')"
  emptyMessage="No tax groups found."
  (page)="onPage($event)"
  (edit)="openEdit($event)"
  (toggleActive)="onToggleActive($event)"
></app-data-table>
