<app-page-header title="Products" subtitle="Sellable/purchasable items belonging to an organization.">
  <button mat-flat-button color="primary" *ngIf="authService.hasPermission('PRODUCT_CREATE')" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Product
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [data]="products()"
  [totalElements]="totalElements()"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [loading]="loading()"
  [editDisabled]="!authService.hasPermission('PRODUCT_UPDATE')"
  [toggleDisabled]="!authService.hasPermission('PRODUCT_UPDATE')"
  emptyMessage="No products found."
  (page)="onPage($event)"
  (edit)="openEdit($event)"
  (toggleActive)="onToggleActive($event)"
></app-data-table>
