<h2 mat-dialog-title>{{ isEdit ? 'Edit Product' : 'Add Product' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Organization</mat-label>
      <mat-select formControlName="organizationId">
        <mat-option *ngFor="let org of organizations()" [value]="org.id">{{ org.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>
      <mat-select formControlName="categoryId">
        <mat-option *ngFor="let cat of categoryOptions()" [value]="cat.id">{{ cat.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tax Group</mat-label>
      <mat-select formControlName="taxGroupId">
        <mat-option [value]="null">None</mat-option>
        <mat-option *ngFor="let group of taxGroupOptions()" [value]="group.id">{{ group.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>UOM</mat-label>
      <mat-select formControlName="uom">
        <mat-option *ngFor="let uom of uomOptions" [value]="uom">{{ uom }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>SKU</mat-label>
      <input matInput formControlName="sku" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Barcode</mat-label>
      <input matInput formControlName="barcode" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Brand</mat-label>
      <input matInput formControlName="brand" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-span">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" />
    </mat-form-field>

    <div class="toggle-row">
      <mat-slide-toggle formControlName="saleEnabled">Sale Enabled</mat-slide-toggle>
    </div>

    <div class="toggle-row">
      <mat-slide-toggle formControlName="purchaseEnabled">Purchase Enabled</mat-slide-toggle>
    </div>

    <div class="toggle-row" *ngIf="isEdit">
      <mat-slide-toggle formControlName="active">Active</mat-slide-toggle>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">Save</button>
  </mat-dialog-actions>
</form>
