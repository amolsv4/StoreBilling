<h2 mat-dialog-title>{{ isEdit ? 'Edit Product Price' : 'Add Product Price' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Price List</mat-label>
      <mat-select formControlName="priceListId">
        <mat-option *ngFor="let pl of priceLists()" [value]="pl.id">{{ pl.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Product</mat-label>
      <mat-select formControlName="productId">
        <mat-option *ngFor="let p of products()" [value]="p.id">{{ p.sku }} - {{ p.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Base Price</mat-label>
      <input matInput type="number" min="0" formControlName="basePrice" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Selling Price</mat-label>
      <input matInput type="number" min="0" formControlName="sellingPrice" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Effective From</mat-label>
      <input matInput type="date" formControlName="effectiveFrom" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Effective To</mat-label>
      <input matInput type="date" formControlName="effectiveTo" />
    </mat-form-field>

    <div class="toggle-row" *ngIf="isEdit">
      <mat-slide-toggle formControlName="active">Active</mat-slide-toggle>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">Save</button>
  </mat-dialog-actions>
</form>
