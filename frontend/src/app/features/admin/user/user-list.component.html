<app-page-header title="Users" subtitle="Staff accounts. Credential/password management is not part of this phase.">
  <button mat-flat-button color="primary" *ngIf="authService.hasPermission('USER_CREATE')" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add User
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [data]="users()"
  [totalElements]="totalElements()"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [loading]="loading()"
  [editDisabled]="!authService.hasPermission('USER_UPDATE')"
  [toggleDisabled]="!authService.hasPermission('USER_UPDATE')"
  emptyMessage="No users found."
  (page)="onPage($event)"
  (edit)="openEdit($event)"
  (toggleActive)="onToggleActive($event)"
></app-data-table>
