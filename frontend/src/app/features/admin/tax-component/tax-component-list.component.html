<app-page-header title="Tax Components" subtitle="Individual tax rates (CGST/SGST/IGST/CESS/GENERAL) belonging to an organization.">
  <button mat-flat-button color="primary" *ngIf="authService.hasPermission('TAX_CREATE')" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Tax Component
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [data]="taxComponents()"
  [totalElements]="totalElements()"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [loading]="loading()"
  [editDisabled]="!authService.hasPermission('TAX_UPDATE')"
  [toggleDisabled]="!authService.hasPermission('TAX_UPDATE')"
  emptyMessage="No tax components found."
  (page)="onPage($event)"
  (edit)="openEdit($event)"
  (toggleActive)="onToggleActive($event)"
></app-data-table>
