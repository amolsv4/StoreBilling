<app-page-header title="Stores" subtitle="Physical or virtual storefronts belonging to an organization.">
  <button mat-flat-button color="primary" *ngIf="authService.hasPermission('STORE_CREATE')" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Store
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [data]="stores()"
  [totalElements]="totalElements()"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [loading]="loading()"
  [editDisabled]="!authService.hasPermission('STORE_UPDATE')"
  [toggleDisabled]="!authService.hasPermission('STORE_UPDATE')"
  emptyMessage="No stores found."
  (page)="onPage($event)"
  (edit)="openEdit($event)"
  (toggleActive)="onToggleActive($event)"
></app-data-table>
