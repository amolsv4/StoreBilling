<app-page-header title="Roles" subtitle="Permission bundles assignable to users.">
  <button mat-flat-button color="primary" *ngIf="authService.hasPermission('ROLE_CREATE')" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Role
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [data]="roles()"
  [totalElements]="totalElements()"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [loading]="loading()"
  [showActiveToggle]="false"
  [editDisabled]="!authService.hasPermission('ROLE_UPDATE')"
  emptyMessage="No roles found."
  (page)="onPage($event)"
  (edit)="openEdit($event)"
></app-data-table>
