<app-page-header title="Categories" subtitle="Product categories, optionally nested under a parent category.">
  <button mat-flat-button color="primary" *ngIf="authService.hasPermission('CATEGORY_CREATE')" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Category
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [data]="categories()"
  [totalElements]="totalElements()"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [loading]="loading()"
  [editDisabled]="!authService.hasPermission('CATEGORY_UPDATE')"
  [toggleDisabled]="!authService.hasPermission('CATEGORY_UPDATE')"
  emptyMessage="No categories found."
  (page)="onPage($event)"
  (edit)="openEdit($event)"
  (toggleActive)="onToggleActive($event)"
></app-data-table>
