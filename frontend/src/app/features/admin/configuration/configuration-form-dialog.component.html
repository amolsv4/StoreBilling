<h2 mat-dialog-title>{{ isEdit ? 'Edit Configuration' : 'Add Configuration' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Config Key</mat-label>
      <input matInput formControlName="configKey" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Data Type</mat-label>
      <mat-select formControlName="dataType">
        <mat-option *ngFor="let type of dataTypes" [value]="type">{{ type }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Scope Type</mat-label>
      <mat-select formControlName="scopeType">
        <mat-option *ngFor="let type of scopeTypes" [value]="type">{{ type }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" *ngIf="isEdit">
      <mat-label>Scope</mat-label>
      <input matInput [value]="editScopeLabel" disabled />
    </mat-form-field>

    <mat-form-field appearance="outline" *ngIf="!isEdit && requiresScopeId">
      <mat-label>Scope</mat-label>
      <mat-select formControlName="scopeId">
        <mat-option *ngFor="let option of scopeOptions()" [value]="option.id">{{ option.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-span">
      <mat-label>Config Value</mat-label>
      <textarea matInput formControlName="configValue" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-span">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" />
    </mat-form-field>

    <div class="toggle-row" *ngIf="isEdit">
      <mat-slide-toggle formControlName="active">Active</mat-slide-toggle>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">Save</button>
  </mat-dialog-actions>
</form>
