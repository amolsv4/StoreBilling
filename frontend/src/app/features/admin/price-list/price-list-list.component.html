<app-page-header title="Price Lists" subtitle="Named price books with an optional effective date range.">
  <button mat-flat-button color="primary" *ngIf="authService.hasPermission('PRICING_CREATE')" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Price List
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [data]="priceLists()"
  [totalElements]="totalElements()"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [loading]="loading()"
  [editDisabled]="!authService.hasPermission('PRICING_UPDATE')"
  [toggleDisabled]="!authService.hasPermission('PRICING_UPDATE')"
  emptyMessage="No price lists found."
  (page)="onPage($event)"
  (edit)="openEdit($event)"
  (toggleActive)="onToggleActive($event)"
></app-data-table>
