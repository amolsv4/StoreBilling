<h2 mat-dialog-title>{{ isEdit ? 'Edit Price List' : 'Add Price List' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Organization</mat-label>
      <mat-select formControlName="organizationId">
        <mat-option *ngFor="let org of organizations()" [value]="org.id">{{ org.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Code</mat-label>
      <input matInput formControlName="code" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-span">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Effective From</mat-label>
      <input matInput type="date" formControlName="effectiveFrom" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Effective To</mat-label>
      <input matInput type="date" formControlName="effectiveTo" />
    </mat-form-field>

    <div class="toggle-row" *ngIf="isEdit">
      <mat-slide-toggle formControlName="active">Active</mat-slide-toggle>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">Save</button>
  </mat-dialog-actions>
</form>
