<div class="line-items-editor-wrapper">
  <table mat-table [dataSource]="rows" class="mat-elevation-z1 line-items-table">
    <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">
      <th mat-header-cell *matHeaderCellDef>{{ column.header }}</th>
      <td mat-cell *matCellDef="let row">
        <input
          *ngIf="column.editable && !disabled; else plainCell"
          type="number"
          class="line-items-cell-input"
          [value]="numericValue(column, row)"
          [step]="column.step ?? 0.001"
          [min]="column.min ?? 0"
          (change)="onCellCommit(column, row, $event)"
        />
        <ng-template #plainCell>{{ cellValue(column, row) }}</ng-template>
      </td>
    </ng-container>

    <ng-container matColumnDef="remove">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button *ngIf="!disabled" matTooltip="Remove line" (click)="onRemove(row)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length">{{ emptyMessage }}</td>
    </tr>
  </table>
</div>
